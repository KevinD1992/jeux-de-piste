<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeu de piste</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f1e8;
  color: #222;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 25px 20px 40px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 25px;
  box-shadow: 0 5px 20px rgba(0,0,0,.12);
}

h1 {
  text-align: center;
  margin-top: 0;
}

.step {
  text-align: center;
  font-weight: bold;
  margin-bottom: 15px;
  color: #777;
}

h2 {
  text-align: center;
}

p {
  line-height: 1.6;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: none;
  border-radius: 12px;
  background: #222;
  color: white;
  font-size: 17px;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
}

.secondary {
  background: #777;
}

.hidden {
  display: none !important;
}

.status {
  margin-top: 20px;
  padding: 15px;
  border-radius: 12px;
  background: #eee;
  text-align: center;
}

.success {
  background: #dff3df;
}

.error {
  background: #f7dddd;
}

#cameraWrap {
  margin-top: 20px;
  text-align: center;
}

video, canvas, #preview {
  width: 100%;
  max-width: 400px;
  border-radius: 15px;
  margin-top: 10px;
}

#preview {
  display: none;
}

.final {
  text-align: center;
  font-size: 20px;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <div class="step" id="stepNumber">Étape 1 / 6</div>

    <h1 id="title">Quand le stress monte…</h1>

    <div id="text"></div>

    <button id="startBtn" onclick="startAdventure()">
      Commencer l'aventure
    </button>

    <button id="locBtn" class="hidden" onclick="checkLocation()">
      📍 Vérifier ma position
    </button>

    <div id="status" class="status hidden"></div>

    <div id="cameraWrap" class="hidden">
      <p><strong>📸 Prends ton selfie pour valider cette étape.</strong></p>

      <video id="video" autoplay playsinline></video>

      <canvas id="canvas" class="hidden"></canvas>

      <img id="preview">

      <button id="photoBtn" onclick="takePhoto()">
        📸 Prendre le selfie
      </button>
    </div>

  </div>
</div>

<script>

/* =========================================================
   COORDONNÉES DES ÉTAPES
   ========================================================= */

const POINTS = {

  1: {
    name: "Videokay / Store 1440",
    lat: 50.68150,
    lng: 4.26900,
    radius: 80,
    selfie: false
  },

  2: {
    name: "Le pilori",
    lat: 50.68189,
    lng: 4.26654,
    radius: 25,
    selfie: true
  },

  3: {
    name: "Les portes du château",
    lat: 50.68341,
    lng: 4.26662,
    radius: 35,
    selfie: true
  },

  4: {
    name: "Le Moulin Banal",
    lat: 50.68374,
    lng: 4.26506,
    radius: 35,
    selfie: true
  },

  /*
     IMPORTANT :
     Le point 5 ne possède volontairement PAS
     de coordonnées GPS.
  */

  5: {
    name: "Le coin de Loki",
    selfie: true,
    manual: true
  },

  6: {
    name: "Retour à l'appartement",
    final: true
  }

};


/* =========================================================
   TEXTES DES ÉTAPES
   ========================================================= */

const STEPS = {

1: {
  title: "Quand le stress monte…",
  text: `
    <p>
    Il existe certaines petites choses vers lesquelles on se tourne
    quand la pression monte…
    </p>

    <p>
    Pour commencer cette aventure, rends-toi chez :
    </p>

    <p>
    <strong>📍 Videokay / Store 1440</strong><br>
    Rue de la Libération 60<br>
    Braine-le-Château
    </p>

    <p>
    Une fois arrivé dans la bonne zone, la prochaine étape sera débloquée.
    </p>
  `
},

2: {
  title: "Un souvenir du passé…",
  text: `
    <p>
    Te voilà arrivé à proximité d'un vestige médiéval.
    </p>

    <p>
    Autrefois, c'était un endroit où les personnes condamnées
    pouvaient être exposées publiquement.
    </p>

    <p>
    <strong>📍 À toi de trouver le pilori.</strong>
    </p>

    <p>
    Lorsque tu es devant lui, prends ton selfie.
    </p>
  `
},

3: {
  title: "La porte du château 👑",
  text: `
    <p>
    Continue ton chemin jusqu'aux
    <strong>portes du château</strong>.
    </p>

    <p>
    On raconte qu'une princesse aurait pu passer par ici…
    </p>

    <p>
    Trouve l'endroit, puis prends ton selfie.
    </p>
  `
},

4: {
  title: "L'eau emporte tout…",
  text: `
    <p>
    Quand les embrouilles deviennent trop nombreuses,
    parfois il faut simplement laisser couler…
    </p>

    <p>
    L'eau finit toujours par emporter les choses
    et, après l'agitation, elle retrouve son calme.
    </p>

    <p>
    <strong>📍 Direction le Moulin Banal.</strong>
    </p>

    <p>
    Une fois devant le moulin, prends ton selfie.
    </p>
  `
},

5: {
  title: "Là où Loki aime prendre du temps 🐾",
  text: `
    <p>
    Voilà, tu arrives à la dernière partie de l'aventure.
    🎉
    </p>

    <p>
    Maintenant, rends-toi
    <strong>là où Loki aime prendre du temps</strong>.
    </p>

    <p>
    Cherche son petit coin à lui.
    Prends le temps de regarder autour de toi
    et de trouver l'endroit.
    </p>

    <p>
    Quand tu penses avoir trouvé,
    <strong>fais ton selfie sur place</strong>. ❤️
    </p>

    <p>
    <strong>
    Dès que la photo est prise, le dernier point sera débloqué.
    </strong>
    </p>
  `
},

6: {
  title: "Dernière étape ❤️",
  text: `
    <div class="final">

      <p>
      🎉 <strong>Bravo !</strong> 🎉
      </p>

      <p>
      Tu as terminé toute l'aventure.
      </p>

      <p>
      Il ne reste plus qu'une chose à faire…
      </p>

      <p>
      <strong>🏠 Retourne à l'appartement.</strong>
      </p>

      <p>
      Rue de Mont Saint Pont 77
      </p>

      <p>
      ❤️
      </p>

    </div>
  `
}

};


/* =========================================================
   VARIABLES
   ========================================================= */

let currentStep = parseInt(localStorage.getItem("jeuStep")) || 1;

let geoValidated = false;
let photoTaken = false;
let stream = null;


/* =========================================================
   INITIALISATION
   ========================================================= */

function init() {

  showStep();

}


/* =========================================================
   AFFICHER UNE ÉTAPE
   ========================================================= */

function showStep() {

  const step = STEPS[currentStep];

  document.getElementById("stepNumber").textContent =
    "Étape " + currentStep + " / 6";

  document.getElementById("title").innerHTML =
    step.title;

  document.getElementById("text").innerHTML =
    step.text;

  document.getElementById("status").classList.add("hidden");

  document.getElementById("cameraWrap").classList.add("hidden");

  document.getElementById("locBtn").classList.add("hidden");

  document.getElementById("startBtn").classList.remove("hidden");

  if (currentStep === 6) {

    document.getElementById("startBtn").classList.add("hidden");

    return;
  }

}


/* =========================================================
   COMMENCER
   ========================================================= */

function startAdventure() {

  document.getElementById("startBtn").classList.add("hidden");

  const point = POINTS[currentStep];

  if (currentStep === 5) {

    /*
      POINT 5 :
      aucune localisation.
      On demande simplement d'aller sur place
      puis de prendre le selfie.
    */

    openCamera();

    return;
  }

  document.getElementById("locBtn").classList.remove("hidden");

  showStatus(
    "📍 Appuie sur le bouton lorsque tu es arrivé.",
    ""
  );

}


/* =========================================================
   MESSAGE
   ========================================================= */

function showStatus(message, type) {

  const box = document.getElementById("status");

  box.innerHTML = message;

  box.className = "status";

  if (type === "ok") {
    box.classList.add("success");
  }

  if (type === "error") {
    box.classList.add("error");
  }

  box.classList.remove("hidden");

}


/* =========================================================
   GPS
   ========================================================= */

function checkLocation() {

  const point = POINTS[currentStep];

  if (!navigator.geolocation) {

    showStatus(
      "❌ La localisation GPS n'est pas disponible sur ce téléphone.",
      "error"
    );

    return;
  }

  showStatus(
    "📍 Recherche de ta position…",
    ""
  );

  navigator.geolocation.getCurrentPosition(

    function(position) {

      const lat = position.coords.latitude;
      const lng = position.coords.longitude;

      const distance = getDistance(
        lat,
        lng,
        point.lat,
        point.lng
      );

      if (distance <= point.radius) {

        geoValidated = true;

        document.getElementById("locBtn").classList.add("hidden");

        showStatus(
          "✅ Bravo ! Tu es au bon endroit.",
          "ok"
        );

        if (point.selfie) {

          setTimeout(function() {
            openCamera();
          }, 500);

        } else {

          setTimeout(function() {
            nextStep();
          }, 800);

        }

      } else {

        showStatus(
          "❌ Tu n'es pas encore au bon endroit.<br><br>" +
          "Tu es à environ " +
          Math.round(distance) +
          " mètres de la zone.",
          "error"
        );

      }

    },

    function(error) {

      showStatus(
        "⚠️ Impossible d'obtenir ta position.<br><br>" +
        "Vérifie que la localisation est activée " +
        "et autorise ton navigateur à utiliser ta position.",
        "error"
      );

    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 5000
    }

  );

}


/* =========================================================
   CALCUL DISTANCE GPS
   ========================================================= */

function getDistance(lat1, lon1, lat2, lon2) {

  const R = 6371000;

  const rad = Math.PI / 180;

  const dLat =
    (lat2 - lat1) * rad;

  const dLon =
    (lon2 - lon1) * rad;

  const a =
    Math.sin(dLat / 2) *
    Math.sin(dLat / 2) +
    Math.cos(lat1 * rad) *
    Math.cos(lat2 * rad) *
    Math.sin(dLon / 2) *
    Math.sin(dLon / 2);

  const c =
    2 * Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

  return R * c;

}


/* =========================================================
   CAMERA
   ========================================================= */

async function openCamera() {

  const cameraWrap =
    document.getElementById("cameraWrap");

  const video =
    document.getElementById("video");

  try {

    stream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user"
        },
        audio: false
      });

    video.srcObject = stream;

    cameraWrap.classList.remove("hidden");

  }

  catch (error) {

    showStatus(
      "⚠️ Impossible d'utiliser la caméra.<br><br>" +
      "Autorise l'accès à la caméra dans ton navigateur.",
      "error"
    );

  }

}


/* =========================================================
   PRENDRE LE SELFIE
   ========================================================= */

function takePhoto() {

  const video =
    document.getElementById("video");

  const canvas =
    document.getElementById("canvas");

  const preview =
    document.getElementById("preview");

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const ctx =
    canvas.getContext("2d");

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  preview.src =
    canvas.toDataURL("image/jpeg");

  preview.style.display = "block";

  video.style.display = "none";

  document.getElementById("photoBtn")
    .classList.add("hidden");

  photoTaken = true;

  if (stream) {

    stream.getTracks().forEach(
      track => track.stop()
    );

  }


  /*
    IMPORTANT :
    Le selfie valide immédiatement l'étape.

    Pour le point 5, il n'y a aucun contrôle GPS.
  */

  showStatus(
    "📸 Selfie enregistré !<br><br>" +
    "Bravo, la dernière étape est maintenant débloquée.",
    "ok"
  );

  setTimeout(function() {

    document.getElementById("cameraWrap")
      .classList.add("hidden");

    nextStep();

  }, 1200);

}


/* =========================================================
   ÉTAPE SUIVANTE
   ========================================================= */

function nextStep() {

  currentStep++;

  if (currentStep > 6) {
    currentStep = 6;
  }

  localStorage.setItem(
    "jeuStep",
    currentStep
  );

  geoValidated = false;
  photoTaken = false;

  showStep();

}


/* =========================================================
   LANCEMENT
   ========================================================= */

init();

</script>

</body>
</html>
