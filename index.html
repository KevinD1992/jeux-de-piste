<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeu de piste</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f1e8;
  color: #222;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 25px 20px 40px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 25px;
  box-shadow: 0 5px 20px rgba(0,0,0,.12);
}

h1 {
  text-align: center;
  margin-top: 0;
}

.step {
  text-align: center;
  font-weight: bold;
  margin-bottom: 15px;
  color: #777;
}

h2 {
  text-align: center;
}

p {
  line-height: 1.6;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: none;
  border-radius: 12px;
  background: #222;
  color: white;
  font-size: 17px;
  cursor: pointer;
}

.hidden {
  display: none !important;
}

.status {
  margin-top: 20px;
  padding: 15px;
  border-radius: 12px;
  background: #eee;
  text-align: center;
}

.success {
  background: #dff3df;
}

.error {
  background: #f7dddd;
}

#cameraWrap {
  margin-top: 20px;
  text-align: center;
}

video,
#preview {
  width: 100%;
  max-width: 400px;
  border-radius: 15px;
  margin-top: 10px;
}

#preview {
  display: none;
}

.final {
  text-align: center;
  font-size: 20px;
}
</style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="step" id="stepNumber">
      Étape 1 / 6
    </div>

    <h1 id="title">
      Quand le stress monte…
    </h1>

    <div id="text"></div>

    <button id="startBtn" onclick="startAdventure()">
      Commencer l'aventure
    </button>

    <button id="locBtn" class="hidden" onclick="checkLocation()">
      📍 Vérifier ma position
    </button>

    <div id="status" class="status hidden"></div>

    <div id="cameraWrap" class="hidden">

      <p>
        <strong>
          📸 Prends ton selfie pour valider cette étape.
        </strong>
      </p>

      <video
        id="video"
        autoplay
        playsinline>
      </video>

      <img id="preview">

      <button
        id="photoBtn"
        onclick="takePhoto()">
        📸 Prendre le selfie
      </button>

    </div>

  </div>

</div>


<script>

/* =====================================================
   POINTS GPS
   Les noms sont uniquement utilisés par le code.
   Ils ne sont jamais affichés au joueur.
   ===================================================== */

const POINTS = {

  1: {
    lat: 50.68150,
    lng: 4.26900,
    radius: 80,
    selfie: false
  },

  2: {
    lat: 50.68189,
    lng: 4.26654,
    radius: 25,
    selfie: true
  },

  3: {
    lat: 50.68341,
    lng: 4.26662,
    radius: 35,
    selfie: true
  },

  4: {
    lat: 50.68374,
    lng: 4.26506,
    radius: 35,
    selfie: true
  },

  /*
    POINT 5 :
    PAS DE GPS.
    Le joueur doit simplement trouver
    l'endroit grâce à l'indice.
  */

  5: {
    selfie: true,
    manual: true
  },

  /*
    POINT 6 :
    étape finale.
    Aucun GPS nécessaire.
  */

  6: {
    final: true
  }

};


/* =====================================================
   TEXTES DES 6 ÉTAPES
   ===================================================== */

const STEPS = {

  1: {

    title: "Quand le stress monte…",

    text: `

      <p>
        Il existe certaines petites choses vers lesquelles
        on se tourne quand la pression monte…
      </p>

      <p>
        Pour commencer ton aventure, cherche un endroit
        où l'on peut trouver de quoi accompagner
        ce petit moment de détente.
      </p>

      <p>
        <strong>
          À toi de trouver l'endroit.
        </strong>
      </p>

      <p>
        Une fois sur place, la suite se débloquera.
      </p>

    `

  },


  2: {

    title: "Un souvenir du passé…",

    text: `

      <p>
        Remonte un peu dans le temps…
      </p>

      <p>
        Imagine une époque où la justice ne se rendait
        pas exactement comme aujourd'hui.
      </p>

      <p>
        Cherche un vestige lié aux anciennes
        punitions publiques, là où les condamnés
        pouvaient autrefois être exposés
        aux regards de tous.
      </p>

      <p>
        <strong>
          Quand tu penses avoir trouvé,
          approche-toi et prends ton selfie.
        </strong>
      </p>

    `

  },


  3: {

    title: "La porte du château 👑",

    text: `

      <p>
        Une histoire de château,
        de pierres anciennes…
        et peut-être d'une princesse. 👑
      </p>

      <p>
        Cherche l'endroit par lequel elle aurait
        pu entrer ou sortir du domaine.
      </p>

      <p>
        Trouve les passages qui gardent encore
        la trace du château.
      </p>

      <p>
        <strong>
          Une fois sur place, prends ton selfie.
        </strong>
      </p>

    `

  },


  4: {

    title: "L'eau emporte tout…",

    text: `

      <p>
        Certaines choses valent mieux que
        d'être laissées derrière soi…
      </p>

      <p>
        L'eau les emporte, les fait disparaître
        peu à peu, puis finit par retrouver son calme.
      </p>

      <p>
        Cherche un endroit où l'eau a longtemps
        été mise à contribution pour faire fonctionner
        quelque chose d'important.
      </p>

      <p>
        <strong>
          Quand tu as trouvé,
          prends ton selfie.
        </strong>
      </p>

    `

  },


  5: {

    title: "Là où Loki aime prendre du temps 🐾",

    text: `

      <p>
        Voilà, tu arrives à la dernière partie
        de l'aventure. 🎉
      </p>

      <p>
        Maintenant, rends-toi
        <strong>
          là où Loki aime prendre du temps.
        </strong>
      </p>

      <p>
        Cherche son petit coin à lui.
        Prends le temps de regarder autour de toi
        et de trouver l'endroit.
      </p>

      <p>
        Quand tu penses avoir trouvé,
        <strong>
          fais ton selfie sur place.
        </strong> ❤️
      </p>

      <p>
        <strong>
          Dès que la photo est prise,
          le dernier point sera débloqué.
        </strong>
      </p>

    `

  },


  6: {

    title: "Dernière étape ❤️",

    text: `

      <div class="final">

        <p>
          🎉 <strong>Bravo !</strong> 🎉
        </p>

        <p>
          Tu as réussi toutes les étapes !
        </p>

        <p>
          Il ne reste plus qu'une dernière chose
          à faire…
        </p>

        <p>
          <strong>
            🏠 Retourne à la maison.
          </strong>
        </p>

        <p>
          ❤️
        </p>

      </div>

    `

  }

};


/* =====================================================
   VARIABLES
   ===================================================== */

let currentStep =
  parseInt(localStorage.getItem("jeuStep")) || 1;

let geoValidated = false;

let photoTaken = false;

let stream = null;


/* =====================================================
   INITIALISATION
   ===================================================== */

function init() {

  showStep();

}


/* =====================================================
   AFFICHER L'ÉTAPE
   ===================================================== */

function showStep() {

  const step = STEPS[currentStep];

  document.getElementById("stepNumber").textContent =
    "Étape " + currentStep + " / 6";

  document.getElementById("title").innerHTML =
    step.title;

  document.getElementById("text").innerHTML =
    step.text;

  document.getElementById("status")
    .classList.add("hidden");

  document.getElementById("cameraWrap")
    .classList.add("hidden");

  document.getElementById("locBtn")
    .classList.add("hidden");

  document.getElementById("startBtn")
    .classList.remove("hidden");


  /*
    Étape 6 :
    pas de bouton.
  */

  if (currentStep === 6) {

    document.getElementById("startBtn")
      .classList.add("hidden");

  }

}


/* =====================================================
   COMMENCER L'AVENTURE
   ===================================================== */

function startAdventure() {

  document.getElementById("startBtn")
    .classList.add("hidden");


  /*
    POINT 5 :
    aucune localisation GPS.
    On ouvre directement la caméra.
  */

  if (currentStep === 5) {

    openCamera();

    return;

  }


  /*
    Points 1 à 4 :
    localisation GPS.
  */

  document.getElementById("locBtn")
    .classList.remove("hidden");

  showStatus(
    "📍 Lorsque tu penses être arrivé au bon endroit, vérifie ta position.",
    ""
  );

}


/* =====================================================
   AFFICHER UN MESSAGE
   ===================================================== */

function showStatus(message, type) {

  const box =
    document.getElementById("status");

  box.innerHTML = message;

  box.className = "status";


  if (type === "ok") {

    box.classList.add("success");

  }


  if (type === "error") {

    box.classList.add("error");

  }


  box.classList.remove("hidden");

}


/* =====================================================
   VÉRIFICATION GPS
   ===================================================== */

function checkLocation() {

  const point = POINTS[currentStep];


  if (!navigator.geolocation) {

    showStatus(
      "❌ La localisation GPS n'est pas disponible sur ce téléphone.",
      "error"
    );

    return;

  }


  showStatus(
    "📍 Recherche de ta position…",
    ""
  );


  navigator.geolocation.getCurrentPosition(

    function(position) {

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;


      const distance =
        getDistance(
          lat,
          lng,
          point.lat,
          point.lng
        );


      if (distance <= point.radius) {

        geoValidated = true;


        document.getElementById("locBtn")
          .classList.add("hidden");


        showStatus(
          "✅ Bravo ! Tu as trouvé !",
          "ok"
        );


        if (point.selfie) {

          setTimeout(
            function() {

              openCamera();

            },
            700
          );

        }

        else {

          setTimeout(
            function() {

              nextStep();

            },
            1000
          );

        }

      }

      else {

        showStatus(

          "❌ Tu n'es pas encore au bon endroit.<br><br>" +

          "Continue à chercher…",

          "error"

        );

      }

    },


    function(error) {

      showStatus(

        "⚠️ Impossible d'obtenir ta position.<br><br>" +

        "Vérifie que la localisation est activée " +

        "et autorise ton navigateur à utiliser ta position.",

        "error"

      );

    },


    {

      enableHighAccuracy: true,

      timeout: 15000,

      maximumAge: 5000

    }

  );

}


/* =====================================================
   CALCUL DE DISTANCE
   ===================================================== */

function getDistance(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R = 6371000;

  const rad =
    Math.PI / 180;


  const dLat =
    (lat2 - lat1) * rad;

  const dLon =
    (lon2 - lon1) * rad;


  const a =

    Math.sin(dLat / 2) *
    Math.sin(dLat / 2)

    +

    Math.cos(lat1 * rad) *
    Math.cos(lat2 * rad) *

    Math.sin(dLon / 2) *
    Math.sin(dLon / 2);


  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );


  return R * c;

}


/* =====================================================
   OUVRIR LA CAMÉRA
   ===================================================== */

async function openCamera() {

  const cameraWrap =
    document.getElementById("cameraWrap");

  const video =
    document.getElementById("video");


  try {

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: "user"
        },

        audio: false

      });


    video.srcObject = stream;

    cameraWrap.classList.remove("hidden");

  }


  catch (error) {

    showStatus(

      "⚠️ Impossible d'utiliser la caméra.<br><br>" +

      "Autorise l'accès à la caméra dans ton navigateur.",

      "error"

    );

  }

}


/* =====================================================
   PRENDRE LE SELFIE
   ===================================================== */

function takePhoto() {

  const video =
    document.getElementById("video");


  const preview =
    document.getElementById("preview");


  /*
    Création du canvas uniquement
    pour capturer l'image.
  */

  const canvas =
    document.createElement("canvas");


  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;


  const ctx =
    canvas.getContext("2d");


  ctx.drawImage(

    video,

    0,
    0,

    canvas.width,
    canvas.height

  );


  preview.src =
    canvas.toDataURL("image/jpeg");


  preview.style.display =
    "block";


  video.style.display =
    "none";


  document.getElementById("photoBtn")
    .classList.add("hidden");


  photoTaken = true;


  /*
    Arrêt de la caméra.
  */

  if (stream) {

    stream
      .getTracks()
      .forEach(
        track => track.stop()
      );

  }


  /*
    IMPORTANT :
    La photo n'est PAS envoyée sur un serveur.

    Elle sert uniquement à constater que
    le selfie a été pris.
  */


  showStatus(

    "📸 Selfie enregistré !<br><br>" +

    "Bravo, la prochaine étape est débloquée.",

    "ok"

  );


  /*
    Passage automatique à l'étape suivante.
  */

  setTimeout(

    function() {

      document.getElementById("cameraWrap")
        .classList.add("hidden");

      nextStep();

    },

    1200

  );

}


/* =====================================================
   PASSER À L'ÉTAPE SUIVANTE
   ===================================================== */

function nextStep() {

  currentStep++;


  if (currentStep > 6) {

    currentStep = 6;

  }


  localStorage.setItem(
    "jeuStep",
    currentStep
  );


  geoValidated = false;

  photoTaken = false;


  showStep();

}


/* =====================================================
   LANCEMENT
   ===================================================== */

init();

</script>

</body>
</html>
